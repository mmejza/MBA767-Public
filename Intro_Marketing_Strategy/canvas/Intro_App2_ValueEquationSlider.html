    --line: rgba(242,237,245,0.14);
    --line-strong: rgba(242,237,245,0.26);
    --shadow: 0 2px 6px rgba(0,0,0,0.3), 0 10px 28px -14px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  --paper: #1A1420; --paper-raised: #241C2C; --paper-sunk: #2C2334;
  --ink: #F2EDF5; --ink-soft: #B6A9C4; --ink-faint: #8B7F98;
  --coral: #FF8266; --coral-tint: #4A2A22;
  --teal: #4FD6C5; --teal-tint: #1B3A36;
  --gold: #FFC04D; --gold-tint: #3D2F14;
  --line: rgba(242,237,245,0.14); --line-strong: rgba(242,237,245,0.26);
  --shadow: 0 2px 6px rgba(0,0,0,0.3), 0 10px 28px -14px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Work Sans', -apple-system, sans-serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 46rem; margin: 0 auto; padding: clamp(2rem,4vw+1rem,4rem) 1.25rem 6rem; }

.eyebrow { font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:500; }
h1 { font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(2rem,1.6rem+1.6vw,2.6rem); line-height:1.1; margin:.4rem 0 0; text-wrap:balance; }
.subtitle { color:var(--ink-soft); margin-top:1rem; max-width:36rem; font-size:1.02rem; }

.appnav { display:flex; gap:.6rem; margin-top:2rem; flex-wrap:wrap; }
.appnav a { font-family:'IBM Plex Mono',monospace; font-size:.78rem; padding:.45rem .8rem; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink-soft); text-decoration:none; }
.appnav a:hover { border-color:var(--ink-soft); color:var(--ink); }

.app-section { margin-top:4rem; }
.app-head { display:flex; align-items:baseline; gap:.7rem; margin-bottom:.4rem; flex-wrap:wrap; }
.app-num { font-family:'IBM Plex Mono',monospace; font-size:.85rem; font-weight:600; }
.app-num.c1 { color: var(--coral); }
.app-num.c2 { color: var(--teal); }
.app-num.c3 { color: var(--gold); }
.app-title { font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.5rem; margin:0; }
.app-desc { color:var(--ink-soft); font-size:.95rem; margin:.6rem 0 1.5rem; max-width:34rem; }

.card {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 1.75rem;
  box-shadow: var(--shadow);
}

/* ---- Quiz ---- */
.dots { display:flex; gap:.4rem; margin-bottom:1.3rem; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--line-strong); transition:background .2s; }
.dot.active { background:var(--coral); }
.dot.done { background:var(--coral); opacity:.4; }
.q-text { font-family:'Fredoka',sans-serif; font-weight:500; font-size:1.2rem; margin-bottom:1.1rem; text-wrap:balance; }
.opt-grid { display:flex; flex-direction:column; gap:.6rem; }
.opt-btn {
  text-align:left; font-family:'Work Sans',sans-serif; font-size:.95rem; color:var(--ink);
  background:var(--paper-sunk); border:1.5px solid transparent; border-radius:12px;
  padding:.85rem 1.1rem; cursor:pointer; transition:border-color .15s, transform .1s;
}
.opt-btn:hover { border-color:var(--coral); }
.opt-btn:active { transform: scale(.98); }
.quiz-result { text-align:center; padding:1rem 0; }
.result-label { font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--coral); }
.result-name { font-family:'Fredoka',sans-serif; font-weight:700; font-size:2rem; margin:.5rem 0 .8rem; color:var(--ink); }
.result-desc { color:var(--ink-soft); font-size:1rem; max-width:30rem; margin:0 auto 1rem; }
.result-thrive { display:inline-block; font-size:.85rem; background:var(--coral-tint); color:var(--coral); padding:.5rem 1rem; border-radius:999px; font-weight:600; }
.restart-btn { display:block; margin:1.5rem auto 0; background:none; border:1px solid var(--line-strong); color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:.78rem; padding:.5rem 1rem; border-radius:999px; cursor:pointer; }

/* ---- Slider app ---- */
.product-tabs { display:flex; gap:.5rem; margin-bottom:1.5rem; flex-wrap:wrap; }
.ptab { font-family:'Work Sans',sans-serif; font-size:.85rem; font-weight:600; padding:.5rem 1rem; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; }
.ptab.active { background:var(--teal); border-color:var(--teal); color:#fff; }
.product-flavor { font-size:.9rem; color:var(--ink-soft); margin-bottom:1.3rem; min-height:2.2em; }
.slider-row { margin-bottom:1.3rem; }
.slider-row label { display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-soft); margin-bottom:.4rem; }
.slider-row label strong { color:var(--ink); font-variant-numeric:tabular-nums; }
input[type=range] { width:100%; accent-color: var(--teal); height:6px; }
.value-readout { text-align:center; margin-top:1.8rem; padding-top:1.6rem; border-top:1px dashed var(--line-strong); }
.value-score { font-family:'Fredoka',sans-serif; font-weight:700; font-size:3rem; color:var(--teal); font-variant-numeric:tabular-nums; }
.value-label { font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-top:-.3rem; }
.value-gauge { height:10px; background:var(--paper-sunk); border-radius:999px; margin:1rem 0 .8rem; overflow:hidden; }
.value-gauge-fill { height:100%; background:linear-gradient(90deg, var(--coral), var(--gold), var(--teal)); border-radius:999px; transition:width .15s; }
.value-reaction { font-size:1rem; font-weight:600; color:var(--ink); }

/* ---- Generator ---- */
.gen-output {
  font-family:'IBM Plex Mono',monospace; font-size:1.05rem; line-height:1.5;
  background:var(--paper-sunk); border-radius:12px; padding:1.4rem 1.5rem;
  min-height:5.5em; display:flex; align-items:center; color:var(--ink);
}
.gen-output.placeholder { color:var(--ink-faint); font-style:italic; }
.gen-btn {
  font-family:'Fredoka',sans-serif; font-weight:600; font-size:.95rem; color:#fff;
  background:var(--gold); border:none; border-radius:999px; padding:.75rem 1.5rem;
  cursor:pointer; margin-top:1rem;
}
.gen-btn:active { transform: scale(.97); }
.gen-reflect { margin-top:1.3rem; }
.gen-reflect label { display:block; font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:.5rem; }
.gen-reflect textarea {
  width:100%; font-family:'Work Sans',sans-serif; font-size:.92rem; color:var(--ink);
  background:var(--paper-raised); border:1.5px solid var(--line-strong); border-radius:10px;
  padding:.7rem .9rem; resize:vertical; min-height:3.2em;
}
.gen-actions { display:flex; align-items:center; gap:.7rem; margin-top:.9rem; flex-wrap:wrap; }
.log-btn {
  font-family:'Work Sans',sans-serif; font-weight:600; font-size:.85rem; color:#fff;
  background:var(--teal); border:none; border-radius:999px; padding:.5rem 1rem; cursor:pointer;
}
.log-btn:disabled { background:var(--line-strong); color:var(--ink-faint); cursor:not-allowed; }
.reveal-btn {
  font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--gold);
  background:none; border:1px solid var(--gold); border-radius:999px; padding:.45rem .9rem;
  cursor:pointer;
}
.gen-reaction { font-size:.88rem; color:var(--teal); font-weight:600; margin-top:.7rem; min-height:1.3em; }
.reveal-box { margin-top:.9rem; background:var(--gold-tint); border-radius:10px; padding:1rem 1.2rem; font-size:.88rem; color:var(--ink-soft); display:none; }
.reveal-box.show { display:block; }
.reveal-box ul { margin:.4rem 0 0; padding-left:1.1rem; }
.reveal-box li { margin:.25rem 0; }
.gen-log { margin-top:1.4rem; }
.gen-log-label { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:.6rem; }
.gen-log-item { font-size:.85rem; padding:.55rem 0; border-top:1px solid var(--line); color:var(--ink-soft); }
.gen-log-item strong { display:block; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:500; margin-bottom:.15rem; }

footer.notes { margin-top:4rem; padding-top:1.5rem; border-top:1px solid var(--line); font-size:.85rem; color:var(--ink-faint); }
footer.notes strong { color: var(--ink-soft); }
@media (max-width: 30rem) { .card { padding: 1.25rem; } }

</style>
</head>
<body>
<div class="page">

  <header>
    <span class="eyebrow">MBA 767 &middot; Orientation &middot; Optional</span>
    <h1>Value Equation Slider</h1>
    <p class="subtitle">Drag perceived benefits and incurred costs for six real (and not-so-real) products, and watch the value score move &mdash; a tactile rerun of Segment 1's Value = Benefits &divide; Costs equation.</p>
  </header>

  <section class="app-section">
    <div class="card">
      <div class="product-tabs" id="productTabs"></div>
      <div class="product-flavor" id="productFlavor"></div>

      <div class="slider-row">
        <label>Perceived Benefits <strong id="benLabel">5</strong></label>
        <input type="range" id="benSlider" min="1" max="10" value="5">
      </div>
      <div class="slider-row">
        <label>Incurred Costs <strong id="costLabel">5</strong></label>
        <input type="range" id="costSlider" min="1" max="10" value="5">
      </div>

      <div class="value-readout">
        <div class="value-score" id="valueScore">1.0</div>
        <div class="value-label">Value Score</div>
        <div class="value-gauge"><div class="value-gauge-fill" id="valueGaugeFill" style="width:50%;"></div></div>
        <div class="value-reaction" id="valueReaction">Fair enough.</div>
      </div>
    </div>
  </section>

</div>

<script>
const products = [
  { name: "Self-Stirring Dinosaur Mug", flavor: "A ceramic mug shaped like a T-Rex that stirs your coffee for you. $34.", ben: 4, cost: 6 },
  { name: "Artisan-Toasted Toast", flavor: "One slice of bread, hand-toasted to order by a barista. $7.", ben: 3, cost: 4 },
  { name: "Charging Backpack", flavor: "An everyday backpack with a phone charger built into the strap. $120.", ben: 7, cost: 6 },
  { name: "Premium Artesian Water", flavor: "A $4 bottle of natural spring water, marketed on purity and source. Regular tap: free. (Segment 1's own example.)", ben: 3, cost: 5 },
  { name: "Travel Neck Pillow", flavor: "A compact memory-foam pillow that actually stops your head from lolling on a red-eye flight. $18.", ben: 6, cost: 3 },
  { name: "Limited-Edition Sneaker Collab", flavor: "A designer sneaker drop, resold within the hour for triple retail. $220, if you can even get a pair.", ben: 6, cost: 8 }
];
let pIndex = 0;
const productTabs = document.getElementById('productTabs');
const productFlavor = document.getElementById('productFlavor');
const benSlider = document.getElementById('benSlider');
const costSlider = document.getElementById('costSlider');
const benLabel = document.getElementById('benLabel');
const costLabel = document.getElementById('costLabel');
const valueScore = document.getElementById('valueScore');
const valueGaugeFill = document.getElementById('valueGaugeFill');
const valueReaction = document.getElementById('valueReaction');

function renderTabs() {
  productTabs.innerHTML = products.map((p,i) => `<button class="ptab${i===pIndex?' active':''}" data-i="${i}">${p.name}</button>`).join('');
  productTabs.querySelectorAll('.ptab').forEach(btn => {
    btn.addEventListener('click', () => { pIndex = +btn.dataset.i; loadProduct(); });
  });
}
function loadProduct() {
  renderTabs();
  const p = products[pIndex];
  productFlavor.textContent = p.flavor;
  benSlider.value = p.ben; costSlider.value = p.cost;
  updateValue();
}
function updateValue() {
  const b = +benSlider.value, c = +costSlider.value;
  benLabel.textContent = b; costLabel.textContent = c;
  const score = b / c;
  valueScore.textContent = score.toFixed(2);
  valueGaugeFill.style.width = Math.min(100, (score/2.5)*100) + '%';
  valueReaction.textContent = score >= 1.4 ? "Great deal — benefits far outweigh the cost." : score >= 0.8 ? "Fair enough. Reasonable trade." : "Why would anyone buy this?";
}
benSlider.addEventListener('input', updateValue);
costSlider.addEventListener('input', updateValue);
loadProduct();
</script>
</body>
</html>
